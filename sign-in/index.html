<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Sign in — Plotgrain</title>
  <link rel="icon" href="/media/plot-icon.png" type="image/png">
</head>
<body class="projects-page auth-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="customer-header">
    <div class="site-wrap">
      <a class="product-identity" href="/" aria-label="Plotgrain home"><span class="product-mark" aria-hidden="true"></span>Plotgrain</a>
      <nav aria-label="Guest navigation"><a href="/#preview">Explore the example</a></nav>
    </div>
  </header>
  <main class="site-wrap" id="main" tabindex="-1">
    <section class="project-panel auth-panel" aria-labelledby="auth-title">
      <h1 id="auth-title">Sign in</h1>
      <p id="auth-intro">Open your Plotgrain workspace.</p>
      <p id="auth-status" class="project-status" role="status">Checking sign-in options…</p>
      <form id="auth-form" class="record-form" method="post" hidden>
        <div id="email-field">
          <label for="auth-email">Email address</label>
          <input id="auth-email" name="email" type="email" autocomplete="username" maxlength="254" required>
        </div>
        <div id="password-field">
          <label for="auth-password">Password</label>
          <div class="password-control">
            <input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="password-strength">
            <button type="button" class="password-toggle" aria-controls="auth-password" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle><path class="eye-slash" d="m4 3 16 18"></path>
              </svg>
            </button>
          </div>
          <small id="password-strength" role="status" hidden></small>
        </div>
        <div id="confirm-field" hidden>
          <label for="confirm-password">Confirm password</label>
          <div class="password-control">
            <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" maxlength="128" aria-describedby="password-match" disabled>
            <button type="button" class="password-toggle" aria-controls="confirm-password" aria-label="Show password confirmation">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.6"></circle><path class="eye-slash" d="m4 3 16 18"></path>
              </svg>
            </button>
          </div>
          <small id="password-match" role="status" hidden></small>
        </div>
        <a id="forgot-password" class="text-action" href="?mode=forgot">Forgot password?</a>
        <button id="auth-submit" type="submit">Sign in</button>
      </form>
      <div id="auth-links" hidden>
        <a id="auth-alternate" class="text-action" href="?mode=signup">Create an account</a>
        <a id="resend-verification" class="text-action" href="?mode=verify" hidden>Resend verification email</a>
      </div>
      <div id="auth-divider" aria-hidden="true" hidden>or</div>
      <a id="continue-chatgpt" class="product-button secondary-button" href="/signin-with-chatgpt?return_to=%2Fprofile%2F" target="_top">Continue with ChatGPT</a>
    </section>
  </main>
  <script type="module" src="/src/sign-in.js"></script>
</body>
</html>
